<div class="page-container">
  <div class="page-header">
    <h1>
      <button mat-icon-button routerLink="/permits"><mat-icon>arrow_back</mat-icon></button>
      {{ isEdit ? 'Edit Permit' : 'New Permit Application' }}
    </h1>
  </div>

  <mat-progress-bar mode="indeterminate" *ngIf="loading && isEdit"></mat-progress-bar>

  <mat-card>
    <mat-card-header>
      <mat-card-title><mat-icon>assignment</mat-icon> Permit Information</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Applicant Name</mat-label>
            <input matInput formControlName="applicant_name">
            <mat-icon matPrefix>person</mat-icon>
            <mat-error *ngIf="form.get('applicant_name')?.hasError('required')">Required</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Applicant ID</mat-label>
            <input matInput formControlName="applicant_id">
            <mat-icon matPrefix>badge</mat-icon>
            <mat-error *ngIf="form.get('applicant_id')?.hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Permit Type</mat-label>
            <mat-select formControlName="permit_type">
              <mat-option *ngFor="let t of permitTypes" [value]="t">{{ t | titlecase }}</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Fee ($)</mat-label>
            <input matInput type="number" formControlName="fee">
            <mat-icon matPrefix>attach_money</mat-icon>
            <mat-error *ngIf="form.get('fee')?.hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" placeholder="Physical location/address">
          <mat-icon matPrefix>location_on</mat-icon>
          <mat-error *ngIf="form.get('location')?.hasError('required')">Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="3" placeholder="Describe the permit purpose..."></textarea>
          <mat-error *ngIf="form.get('description')?.hasError('required')">Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Notes</mat-label>
          <textarea matInput formControlName="notes" rows="2"></textarea>
        </mat-form-field>

        <div class="form-actions">
          <button mat-stroked-button type="button" routerLink="/permits">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            <mat-icon>save</mat-icon> {{ isEdit ? 'Update' : 'Submit' }} Permit
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
