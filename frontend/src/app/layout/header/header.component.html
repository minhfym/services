<header class="app-header">
  <div class="breadcrumb">
    <mat-icon class="home-icon">home</mat-icon>
    <span class="separator">/</span>
    <span class="current-page">{{ breadcrumb }}</span>
  </div>

  <div class="header-actions">
    <button mat-icon-button class="notification-btn" title="Notifications">
      <mat-icon>notifications</mat-icon>
    </button>

    <div class="user-menu" [matMenuTriggerFor]="userMenu">
      <div class="avatar" *ngIf="currentUser">
        {{ getInitials(currentUser.name) }}
      </div>
      <span class="user-name" *ngIf="currentUser">{{ currentUser.name }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </div>

    <mat-menu #userMenu="matMenu">
      <div class="menu-header" *ngIf="currentUser">
        <span class="menu-user-name">{{ currentUser.name }}</span>
        <span class="menu-user-email">{{ currentUser.email }}</span>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</header>
