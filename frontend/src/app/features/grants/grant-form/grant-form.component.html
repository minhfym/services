<div class="page-container">
  <div class="page-header">
    <h1><button mat-icon-button routerLink="/grants"><mat-icon>arrow_back</mat-icon></button>
    {{ isEdit ? 'Edit Grant' : 'Create New Grant' }}</h1>
  </div>
  <mat-card>
    <mat-card-header><mat-card-title><mat-icon>card_giftcard</mat-icon> Grant Details</mat-card-title></mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Grant Title</mat-label>
          <input matInput formControlName="title" placeholder="Grant title">
          <mat-error *ngIf="form.get('title')?.hasError('required')">Required</mat-error>
        </mat-form-field>
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Grant Type</mat-label>
            <mat-select formControlName="grant_type">
              <mat-option *ngFor="let t of grantTypes" [value]="t">{{ t | titlecase }}</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Total Amount ($)</mat-label>
            <input matInput type="number" formControlName="total_amount">
            <mat-icon matPrefix>attach_money</mat-icon>
            <mat-error *ngIf="form.get('total_amount')?.hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Application Deadline</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="deadline">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <mat-error *ngIf="form.get('deadline')?.hasError('required')">Required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="4"></textarea>
          <mat-error *ngIf="form.get('description')?.hasError('required')">Required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Eligibility Criteria</mat-label>
          <textarea matInput formControlName="eligibility_criteria" rows="4"></textarea>
          <mat-error *ngIf="form.get('eligibility_criteria')?.hasError('required')">Required</mat-error>
        </mat-form-field>
        <div class="form-actions">
          <button mat-stroked-button type="button" routerLink="/grants">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            <mat-icon>save</mat-icon> {{ isEdit ? 'Update' : 'Create' }} Grant
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
