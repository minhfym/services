<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo-area">
      <mat-icon class="logo-icon">account_balance</mat-icon>
      <div class="logo-text">
        <span class="portal-name">GovPortal</span>
        <span class="portal-subtitle">Services Delivery</span>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      [matTooltip]="item.label"
      matTooltipPosition="right"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info" *ngIf="currentUser">
      <div class="avatar">{{ getInitials(currentUser.name) }}</div>
      <div class="user-details">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="user-role">{{ currentUser.role | titlecase }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </div>
</div>
